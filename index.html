<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      touch-action: none; 
    }

    .control-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(17, 17, 17, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid #282828;
      z-index: 1000;
    }

    input[type="range"] {
      accent-color: #a3a3a3;
    }

    .base-shape {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #333333;
      border-radius: var(--global-radius, 50%);
      transition: background-color 0.2s ease, transform 0.15s ease, border-radius 0.1s linear;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
    }

    .base-shape:hover {
      background-color: #444444;
      transform: scale(1.05);
      z-index: 2;
    }

    .circle-2 {
      position: absolute;
      border-radius: var(--global-radius, 50%);
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transition: border-radius 0.1s linear;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes popIn {
      0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 4px;
    }
  </style>
</head>
<body class="flex flex-col items-center pt-28 pb-12 min-h-screen">

  <!-- Top Fixed Control Panel -->
  <header class="control-panel px-4 py-3 sm:px-8 sm:py-4 shadow-2xl">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4">
      
      <!-- Title & Info -->
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-neutral-300 animate-pulse"></div>
        <h1 class="text-sm font-semibold tracking-wider text-neutral-200">Dot...</h1>
        <span id="circle2Counter" class="text-xs px-2 py-0.5 rounded-full bg-neutral-800 text-neutral-400 font-mono">
        </span>
      </div>

      <!-- Controls Group -->
      <div class="flex flex-wrap items-center gap-6 text-xs text-neutral-300">
        
        <!-- Slider 1: Count -->
        <div class="flex items-center gap-3">
          <label for="countSlider" class="whitespace-nowrap font-medium text-neutral-400">Dot</label>
          <input 
            type="range" 
            id="countSlider" 
            min="0" 
            max="1000" 
            value="100" 
            class="w-24 sm:w-36 h-1.5 bg-neutral-800 rounded-lg appearance-none cursor-pointer"
          >
          <span id="countValue" class="font-mono w-12 text-right text-neutral-200">100</span>
        </div>

        <!-- Slider 2: Radius -->
        <div class="flex items-center gap-3">
          <label for="radiusSlider" class="whitespace-nowrap font-medium text-neutral-400">Round</label>
          <input 
            type="range" 
            id="radiusSlider" 
            min="0" 
            max="50" 
            value="50" 
            class="w-24 sm:w-36 h-1.5 bg-neutral-800 rounded-lg appearance-none cursor-pointer"
          >
          <span id="radiusValue" class="font-mono w-16 text-right text-neutral-200">Circle</span>
        </div>

        <!-- Clear / Reset Overlay Button -->
        <button 
          id="clearBtn"
          class="px-3 py-1.5 bg-neutral-800 hover:bg-neutral-700 active:bg-neutral-900 border border-neutral-700 text-neutral-200 rounded-lg transition text-xs flex items-center gap-1.5 shadow-sm"
          title="새로 생성된 동그라미2 모두 지우기"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          reset
        </button>

      </div>
    </div>
  </header>

  <!-- Main Grid Area -->
  <main class="w-full max-w-7xl px-4 sm:px-8 flex-1 flex justify-center items-center">
    <div 
      id="gridContainer" 
      class="w-full grid gap-3 sm:gap-4 transition-all"
      style="grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));"
    >
      <!-- Base shape circles rendered dynamically -->
    </div>
  </main>

  <script>
    const gridContainer = document.getElementById('gridContainer');
    const countSlider = document.getElementById('countSlider');
    const radiusSlider = document.getElementById('radiusSlider');
    const countValue = document.getElementById('countValue');
    const radiusValue = document.getElementById('radiusValue');
    const circle2Counter = document.getElementById('circle2Counter');
    const clearBtn = document.getElementById('clearBtn');

    let currentRadius = 50;
    let totalCircle2Count = 0;
    let isDragging = false;
    let lastTouchedTarget = null; // Prevents spam-creating 100 circles on 1 pixel movement

    // Adjust grid column sizing dynamically based on total base shapes for optimal layout
    function adjustGridColumns(count) {
      if (count > 600) {
        gridContainer.style.gridTemplateColumns = 'repeat(auto-fill, minmax(22px, 1fr))';
        gridContainer.style.gap = '6px';
      } else if (count > 300) {
        gridContainer.style.gridTemplateColumns = 'repeat(auto-fill, minmax(32px, 1fr))';
        gridContainer.style.gap = '8px';
      } else {
        gridContainer.style.gridTemplateColumns = 'repeat(auto-fill, minmax(45px, 1fr))';
        gridContainer.style.gap = '14px';
      }
    }

    function renderBaseShapes(targetCount) {
      const currentCount = gridContainer.children.length;

      if (targetCount > currentCount) {
        const fragment = document.createDocumentFragment();
        for (let i = currentCount; i < targetCount; i++) {
          const shape = document.createElement('div');
          shape.className = 'base-shape';
          fragment.appendChild(shape);
        }
        gridContainer.appendChild(fragment);
      } else if (targetCount < currentCount) {
        for (let i = currentCount; i > targetCount; i--) {
          const removed = gridContainer.lastElementChild;
        
          const innerCircles = removed.querySelectorAll('.circle-2').length;
          totalCircle2Count -= innerCircles;
          gridContainer.removeChild(removed);
        }
      }

      adjustGridColumns(targetCount);
      countValue.textContent = `${targetCount}`;
      updateCircle2Counter();
    }

  
    function updateGlobalRadius(val) {
      currentRadius = val;
      document.documentElement.style.setProperty('--global-radius', `${val}%`);
      
      if (val === '0') {
        radiusValue.textContent = '(0%)';
      } else if (val === '50') {
        radiusValue.textContent = '(50%)';
      } else {
        radiusValue.textContent = `${val}%`;
      }
    }

 
    function spawnCircle2(parentBaseShape) {
      if (!parentBaseShape || !parentBaseShape.classList.contains('base-shape')) return;

      const circle2 = document.createElement('div');
      circle2.className = 'circle-2';

  
      const hue = Math.floor(Math.random() * 360);
      const saturation = Math.floor(Math.random() * 20) + 80;
      const lightness = Math.floor(Math.random() * 20) + 60; 
      circle2.style.backgroundColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
      const sizePercent = Math.floor(Math.random() * 81) + 20; 
      circle2.style.width = `${sizePercent}%`;
      circle2.style.height = `${sizePercent}%`;


      parentBaseShape.appendChild(circle2);

      totalCircle2Count++;
      updateCircle2Counter();
    }

    function updateCircle2Counter() {
      circle2Counter.textContent = `Yours: ${Math.max(0, totalCircle2Count)}`;
    }
    function handlePointerAction(e) {
      const target = document.elementFromPoint(e.clientX, e.clientY);
      if (!target) return;

      const baseShape = target.closest('.base-shape');
      if (baseShape && baseShape !== lastTouchedTarget) {
        spawnCircle2(baseShape);
        lastTouchedTarget = baseShape;
      }
    }
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.control-panel')) return;

      isDragging = true;
      lastTouchedTarget = null;
      handlePointerAction(e);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      handlePointerAction(e);
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
      lastTouchedTarget = null;
    });

    window.addEventListener('pointercancel', () => {
      isDragging = false;
      lastTouchedTarget = null;
    });

    // Control Event Listeners
    countSlider.addEventListener('input', (e) => {
      renderBaseShapes(parseInt(e.target.value, 10));
    });

    radiusSlider.addEventListener('input', (e) => {
      updateGlobalRadius(e.target.value);
    });

    clearBtn.addEventListener('click', () => {
      document.querySelectorAll('.circle-2').forEach(el => el.remove());
      totalCircle2Count = 0;
      updateCircle2Counter();
    });

    window.onload = () => {
      updateGlobalRadius(radiusSlider.value);
      renderBaseShapes(parseInt(countSlider.value, 10));
    };
  </script>
</body>
</html>
